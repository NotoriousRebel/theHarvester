services:
  theharvester.svc.local:
    image: theharvester:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      THEHARVESTER_API_KEY_FILE: /run/secrets/wayfinder-api-key
      THEHARVESTER_WAYFINDER_ARTIFACTS: /var/lib/theharvester/wayfinder-artifacts
      THEHARVESTER_WAYFINDER_DB: /var/lib/theharvester/wayfinder.sqlite
      THEHARVESTER_WAYFINDER_LOCAL_PROXY: enabled
    secrets:
      - source: wayfinder-api-key
        target: wayfinder-api-key
    volumes:
      - theharvester-data:/var/lib/theharvester
      - ./theHarvester/data/api-keys.yaml:/etc/theHarvester/api-keys.yaml:ro
      - ./theHarvester/data/proxies.yaml:/etc/theHarvester/proxies.yaml:ro
    ports:
      - "127.0.0.1:${THEHARVESTER_PORT:-5000}:8000"

volumes:
  theharvester-data:

secrets:
  wayfinder-api-key:
    file: ${THEHARVESTER_API_KEY_FILE:-./.secrets/wayfinder-api-key}
